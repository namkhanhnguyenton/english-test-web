{% extends 'base.html' %}

{% block title %}Đổi Mật Khẩu Cá Nhân — EnglishTest{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200 shadow-xl p-8 md:p-10">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 mx-auto flex items-center justify-center mb-4 border border-indigo-100 shadow-sm">
                <i data-lucide="key-round" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900">Đổi Mật Khẩu Cá Nhân</h2>
            <p class="text-xs text-slate-500 mt-1">
                Tài khoản: <strong class="text-indigo-600">@{{ user.username }}</strong> 
                ({{ "Quản trị viên tối cao" if user.is_admin() else "Giáo viên bộ môn" }})
            </p>
        </div>

        <form method="POST" action="{{ url_for('admin_change_password') }}" class="space-y-5">
            <div>
                <label for="old_password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Mật khẩu hiện tại <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </div>
                    <input 
                        type="password" 
                        id="old_password" 
                        name="old_password" 
                        required 
                        autofocus
                        class="w-full pl-10 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-medium"
                        placeholder="Nhập mật khẩu hiện tại của bạn..."
                    >
                </div>
            </div>

            <div>
                <label for="new_password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Mật khẩu mới <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                    </div>
                    <input 
                        type="password" 
                        id="new_password" 
                        name="new_password" 
                        required 
                        minlength="4"
                        class="w-full pl-10 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-medium"
                        placeholder="Tối thiểu 4 ký tự..."
                    >
                </div>
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Xác nhận mật khẩu mới <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                    </div>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        required 
                        minlength="4"
                        class="w-full pl-10 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-medium"
                        placeholder="Nhập lại mật khẩu mới..."
                    >
                </div>
            </div>

            <button 
                type="submit" 
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow-lg shadow-indigo-100 hover:shadow-indigo-200 transition-all flex items-center justify-center space-x-2"
            >
                <i data-lucide="check" class="w-4 h-4"></i>
                <span>Xác nhận cập nhật mật khẩu</span>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
            <a href="{{ url_for('admin_dashboard') }}" class="inline-block text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
                ← Quay lại Bảng điều khiển
            </a>
        </div>

    </div>
</div>
{% endblock %}
