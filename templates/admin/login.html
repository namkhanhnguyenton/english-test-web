{% extends 'base.html' %}

{% block title %}Đăng Nhập Quản Trị & Giáo Viên — EnglishTest{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200 shadow-xl p-8 md:p-10">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 mx-auto flex items-center justify-center mb-4 border border-indigo-100 shadow-sm">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900">Cổng Quản Trị & Giáo Viên</h2>
            <p class="text-xs text-slate-500 mt-1">Dành cho Quản trị viên (Admin) và Giáo viên bộ môn</p>
        </div>

        <form method="POST" action="{{ url_for('admin_login') }}" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Tên đăng nhập
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        autofocus
                        class="w-full pl-10 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-medium"
                        placeholder="Nhập username admin hoặc giáo viên..."
                    >
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Mật khẩu
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        class="w-full pl-10 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-medium"
                        placeholder="Nhập mật khẩu..."
                    >
                </div>
            </div>

            <button 
                type="submit" 
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow-lg shadow-indigo-100 hover:shadow-indigo-200 transition-all flex items-center justify-center space-x-2"
            >
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span>Đăng nhập hệ thống</span>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
            <a href="{{ url_for('home') }}" class="inline-block text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
                ← Về trang chủ kiểm tra tiếng Anh
            </a>
        </div>

    </div>
</div>
{% endblock %}
